<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📰 Daily Tech Newsletter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: #ffffff;
            color: #000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
        }

        h1 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            color: #666;
            margin-bottom: 40px;
        }

        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="email"] {
            flex: 1;
            padding: 12px 16px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: inherit;
        }

        input[type="email"]::placeholder {
            color: #999;
        }

        input[type="email"]:focus {
            outline: none;
            border-color: #000;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border: 1px solid #000;
            background: #000;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background: #333;
            border-color: #333;
        }

        .success-message {
            display: none;
            padding: 12px;
            background: #f0f0f0;
            border-radius: 4px;
            font-size: 14px;
            color: #000;
        }

        .footer {
            margin-top: 40px;
            font-size: 13px;
            color: #999;
        }

        .footer p {
            margin-bottom: 0;
        }

        .footer a {
            color: #999;
            text-decoration: none;
            border-bottom: 1px solid #999;
            transition: color 0.2s;
        }

        .footer a:hover {
            color: #000;
            border-bottom-color: #000;
        }

        .coffee-button {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            font-size: 13px;
            border: 1px solid #999;
            background: #fff;
            color: #999;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }

        .coffee-button:hover {
            background: #f5f5f5;
            color: #000;
            border-color: #000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Daily Tech Newsletter</h1>
        
        <p>Stay updated with the latest in technology. Curated daily by AI but maintained by humans.</p>

        <form id="signup-form">
            <div class="form-group">
                <input 
                    type="email" 
                    id="email" 
                    placeholder="Your email" 
                    required
                >
                <button type="submit">Subscribe</button>
            </div>
            <div class="success-message" id="success-message">
                Thank you!!
            </div>
        </form>

        <div class="footer">
            <a href="https://buymeacoffee.com/jonnadul" class="coffee-button">☕ Buy me coffee</a>
        </div>
    </div>

    <script>
        document.getElementById('signup-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const successMessage = document.getElementById('success-message');
            
            console.log('Signup email:', email);
            
            // Send webhook request
            fetch('https://dd0d7c74067d.ngrok-free.app/webhook/a39d3abe-4147-440e-be97-dcd13043e697', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ email: email })
            })
            .catch(error => console.error('Webhook error:', error));
            
            successMessage.style.display = 'block';
            document.getElementById('email').value = '';
            
            setTimeout(() => {
                successMessage.style.display = 'none';
            }, 5000);
        });
    </script>
</body>
</html>
